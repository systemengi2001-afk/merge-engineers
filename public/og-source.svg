<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf8f2"/><stop offset="1" stop-color="#f2efe6"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#118f8a"/><stop offset="1" stop-color="#087a77"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="blur2"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<!-- abstract botanical light/shadow -->
<g opacity=".14" filter="url(#blur)" fill="#64745c">
 <ellipse cx="865" cy="70" rx="42" ry="125" transform="rotate(-38 865 70)"/>
 <ellipse cx="950" cy="120" rx="34" ry="105" transform="rotate(25 950 120)"/>
 <ellipse cx="1085" cy="255" rx="42" ry="125" transform="rotate(-52 1085 255)"/>
 <ellipse cx="975" cy="390" rx="40" ry="118" transform="rotate(48 975 390)"/>
 <ellipse cx="1130" cy="510" rx="44" ry="125" transform="rotate(-38 1130 510)"/>
</g>
<!-- translucent editorial arcs -->
<circle cx="1110" cy="140" r="230" fill="#ffffff" opacity=".22" stroke="#fff" stroke-width="2"/>
<circle cx="1120" cy="450" r="270" fill="#8aa39b" opacity=".08" stroke="#fff" stroke-width="2"/>
<path d="M760 630 C860 470 920 285 1200 170" fill="none" stroke="#ffffff" stroke-width="2" opacity=".72"/>
<path d="M835 630 C930 455 1000 350 1200 315" fill="none" stroke="#9eb1aa" stroke-width="2" opacity=".28"/>
<!-- foreground soft leaves -->
<g opacity=".18" filter="url(#blur2)" fill="#5e7054">
 <ellipse cx="1105" cy="110" rx="30" ry="80" transform="rotate(58 1105 110)"/>
 <ellipse cx="1165" cy="185" rx="28" ry="72" transform="rotate(-50 1165 185)"/>
 <ellipse cx="1065" cy="520" rx="34" ry="92" transform="rotate(58 1065 520)"/>
</g>
<!-- brand -->
<text x="70" y="135" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="64" font-weight="400" letter-spacing="13" fill="#111">MeRGe<tspan fill="#118f8a">.</tspan></text>
<line x1="72" y1="202" x2="110" y2="202" stroke="#118f8a" stroke-width="3"/>
<text x="136" y="209" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="18" font-weight="400" letter-spacing="7" fill="#777">WEB DESIGN / DEVELOPMENT</text>
<!-- headline -->
<text x="70" y="345" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="72" font-weight="800" fill="#111">伝わる設計を、</text>
<text x="70" y="445" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="76" font-weight="800" fill="url(#teal)">使われるWebへ。</text>
<text x="72" y="520" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="25" font-weight="400" fill="#666">ホームページ・LP・Webシステムを、企画から実装まで。</text>
</svg>