<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JONG AI"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.svg"><title>JONG AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.s{max-width:720px;margin:auto;padding:26px 16px 70px}.brand{font-weight:900;letter-spacing:.18em}.hero{font-size:34px;line-height:1.15;margin:28px 0 8px}.sub{color:#9da7b2;line-height:1.6}.card{background:#13171c;border:1px solid #252d36;border-radius:22px;padding:17px;margin:14px 0}label{display:block;font-size:12px;color:#9da7b2;margin:10px 0 6px}input,select{width:100%;font-size:16px;padding:13px;border-radius:12px;border:1px solid #252d36;background:#191f26;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:800;margin-top:14px}.best{font-size:50px;font-weight:900}.m{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#191f26;border-radius:14px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 4px;border-bottom:1px solid #252d36;text-align:right}th:first-child,td:first-child{text-align:left}.hidden{display:none}.status,.note{color:#9da7b2;font-size:13px;margin-top:9px;line-height:1.5}.scoreline{margin-top:10px;font-size:14px;color:#d8dee6}@media(min-width:580px){.m{grid-template-columns:repeat(5,1fr)}}</style></head><body><main class="s">
<div class="brand">JONG AI</div><h1 class="hero">最善の一打を、<br>スマホで。</h1><p class="sub">公開β版。和了率だけでなく、ドラ・赤ドラ・抜き北などによる打点差をEVへ反映します。</p>
<div class="card"><label>手牌（MPSZ）</label><input id="hand" value="11m2356789p23778s"><div class="row"><div><label>ルール</label><select id="rules"><option value="sanma_standard">三麻 標準</option><option value="osaka_sanma_v1">大阪三麻</option><option value="yonma_standard">四麻 標準</option></select></div><div><label>残り自摸</label><input id="draws" type="number" min="1" max="6" value="3"></div></div><div class="row"><div><label>抜き北</label><input id="nuki" type="number" min="0" max="4" value="0"></div><div><label>ドラ表示牌</label><input id="dora" placeholder="4p,9s"></div></div><div class="row"><div><label>赤ドラ枚数</label><input id="red" type="number" min="0" max="4" value="0"></div><div><label>親</label><select id="dealer"><option value="0">子</option><option value="1">親</option></select></div></div><button id="go">AI解析する</button><div id="status" class="status"></div></div>
<section id="result" class="hidden"><div class="card"><div id="best" class="best">—</div><div class="m"><div class="metric">EV<b id="ev">—</b></div><div class="metric">推定打点<b id="score">—</b></div><div class="metric">和了率<b id="win">—</b></div><div class="metric">聴牌率<b id="ten">—</b></div><div class="metric">受け入れ<b id="uke">—</b></div></div><div id="scoreline" class="scoreline"></div><div id="note" class="note"></div></div><div class="card"><b>全候補</b><div style="overflow:auto"><table><thead><tr><th>打牌</th><th>EV</th><th>打点</th><th>ドラ</th><th>和了</th><th>受入</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</main><script>
const $=id=>document.getElementById(id),pct=v=>(v*100).toFixed(1)+"%";
$("go").addEventListener("click",async()=>{try{$("status").textContent="解析中…";const ruleset=$("rules").value;const dora=$("dora").value.split(",").map(x=>x.trim()).filter(Boolean);const body={hand:$("hand").value.trim(),draws:+$("draws").value,ruleset,game_mode:ruleset==="yonma_standard"?"yonma":"sanma",nuki_count:+$("nuki").value,red_dora_count:+$("red").value,dealer:$("dealer").value==="1",dora_indicators:dora,visible_tiles:[]};const r=await fetch("/v1/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.detail||"解析エラー");const c=j.candidates,b=c[0];$("best").textContent=b.discard+" 切り";$("ev").textContent=Math.round(b.expected_points)+"pt";$("score").textContent=Math.round(b.average_win_points)+"pt";$("win").textContent=pct(b.win_probability);$("ten").textContent=pct(b.tenpai_probability);$("uke").textContent=b.ukeire_total+"枚";$("scoreline").textContent=`推定 ${b.estimated_han}翻 / ドラ${b.dora_count}・赤${b.red_dora_count}・抜き北${b.nuki_dora_count}`;$("note").textContent=(b.score_reasons||[]).join(" / ")+"。打点は現時点の形からの近似です。";$("rows").innerHTML=c.map(x=>`<tr><td>${x.discard}</td><td>${Math.round(x.expected_points)}</td><td>${Math.round(x.average_win_points)}</td><td>${x.dora_count+x.red_dora_count+x.nuki_dora_count}</td><td>${pct(x.win_probability)}</td><td>${x.ukeire_total}</td></tr>`).join("");$("result").classList.remove("hidden");$("status").textContent="解析完了";}catch(e){$("status").textContent=e.message}});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script></body></html>
